# Curated safe accent families for the SSOT theme engine.
# Accents are tasteful (limited chroma); surfaces come from wallpaper at build time.

[sand]
family = "sand"
# Loved warm sand (warm wallpaper bias target)
primary = "#ffb688"
secondary = "#e5bfa9"
on_primary = "#512400"
primary_container = "#6e380f"
tertiary = "#cac993"
outline = "#c4a882"
