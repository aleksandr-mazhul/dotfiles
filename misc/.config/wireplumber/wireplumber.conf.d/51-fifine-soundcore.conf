# Fifine USB mic headphone jack is the desk output (Soundcore).
# Rename only the sink; leave the capture node as fifine.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.usb-3142_fifine_Microphone-00.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "soundcore"
        node.nick = "soundcore"
      }
    }
  }
]
