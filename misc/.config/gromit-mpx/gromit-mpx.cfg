# Gromit-MPX — on-screen paint while recording (Hyprland)
# Restart gromit-mpx after edits. Hotkeys are owned by Hyprland binds
# (see binds.lua); keep built-in keys disabled.

"red Pen" = PEN (size=5 color="red");
"blue Pen" = "red Pen" (color="blue");
"yellow Pen" = "red Pen" (color="yellow");
"green Pen" = "red Pen" (color="green");
"orange Marker" = PEN (size=18 color="rgba(255, 140, 0, 0.45)");
"green Marker" = PEN (size=18 color="rgba(50, 205, 50, 0.45)");

"Eraser" = ERASER (size=75);

"green Line" = LINE (size=4 color="green" arrowsize=1);
"red Rectangle" = RECT (size=3 color="red");
"blue Circle" = CIRCLE (size=3 color="blue");
"red Filled Circle" = CIRCLE (size=3 color="black" fillcolor="rgba(255, 0, 0, 0.35)");
"red Smoothed" = SMOOTH (color="red" size=5 simplify=10 snap=30);

"default" = "red Pen";
"default"[SHIFT] = "blue Pen";
"default"[CONTROL] = "yellow Pen";
"default"[2] = "orange Marker";
"default"[Button3] = "Eraser";
"default"[ALT] = "blue Circle";
"default"[ALT,SHIFT] = "red Filled Circle";
"default"[ALT,CONTROL] = "green Line";

# Hyprland owns global shortcuts — don't grab F8/F9.
# Toggle: Super+Shift+Alt+D  Clear: Super+Shift+Alt+C  (see binds.lua)
HOTKEY = "none";
UNDOKEY = "none";
