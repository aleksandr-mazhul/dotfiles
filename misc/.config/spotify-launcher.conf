# Native Wayland (Spotify is CEF/Chromium). Under XWayland it is rendered at
# 1.0 and upscaled by Hyprland's 1.25 monitor scale -> blurry. Ozone/Wayland
# lets Chromium use wp-fractional-scale and render sharp at 1.25.
[spotify]
extra_arguments = [
  "--enable-features=UseOzonePlatform,WaylandWindowDecorations",
  "--ozone-platform=wayland",
]
