# Arch google-chrome-stable wrapper reads this file (one flag set per line).
# Chrome writes exit_type=Crashed at startup and only flips it to Normal if
# the browser process finishes its own quit path. Logout, reboot, and a
# dropped Wayland socket skip that write, so the next launch shows
# "Restore pages? Chrome didn't shut down correctly."
# Tabs are already on disk (Sessions/Tabs_*). Restore them, and do not ask.
--restore-last-session
--hide-crash-restore-bubble
