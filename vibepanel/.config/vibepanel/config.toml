# vibepanel — see https://github.com/prankstr/vibepanel

[bar]
position = "top"
size = 32
border_radius = 30
background_opacity = 0.0

[widgets]
left = ["workspaces", "window_title"]
center = ["media"]
right = [
  "tray",
  "updates",
  "cpu",
  "quick_settings",
  "battery",
  "clock",
  "notifications",
]
border_radius = 40
background_opacity = 1.0

[widgets.workspaces]
# Show workspace letters (W/E/T/...) from Hyprland defaultName
label_type = "name"

[theme]
mode = "dark"

[theme.icons]
theme = "material"
weight = 400

[osd]
enabled = true
position = "bottom"
show_value = false

[audio]
allow_overdrive = false

[advanced]
# compositor = "auto"
