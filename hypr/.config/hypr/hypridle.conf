# hypridle — no idle auto-lock / no DPMS-off on timeout.
# Manual lock: Super+Shift+L. Sleep still locks via before_sleep_cmd.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # Run repair after hyprlock exits (unlock) or if lock never started.
    lock_cmd = ~/.config/hypr/scripts/hyprlock-with-repair.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/session-unlock-repair.sh
    ignore_dbus_inhibit = false
}
