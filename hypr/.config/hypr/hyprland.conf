# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################
# See https://wiki.hypr.land/Configuring/Monitors/

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf
# hyprexpo not installed — GloView used instead for Mission Control
# source = ~/.config/hypr/hyprexpo.conf
# Load plugin BEFORE sourcing binds (tilde ~ does not expand in plugin=)
plugin = /home/stranger/.local/lib/hypr/gloview.so
source = ~/.config/hypr/gloview.conf
source = ~/.config/hypr/colors-matugen.conf

monitor=,preferred,auto,auto
#monitor=DP-2,1920x1080@165,-1080x-240,1,transform,1
#monitor=DP-3,2560x1440@165,0x0,1 





################### 
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = /home/stranger/.local/bin/nautilus-dark --new-window
#$menu = hyprlauncher
$menu = wofi --show drun
$browser = firefox

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = vibepanel
exec-once = hyprpolkitagent
exec-once = swww-daemon
exec-once = waypaper --restore
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/ocr-daemon-start.sh
exec-once = xrdb -merge ~/.Xresources
# VPN (best) + Telegram / Cursor / Kitty
exec-once = ~/.config/hypr/scripts/session-autostart.sh
# Apply workspace letters to already-created workspaces
exec-once = hyprctl dispatch renameworkspace 1 W & hyprctl dispatch renameworkspace 2 E & hyprctl dispatch renameworkspace 3 T & hyprctl dispatch renameworkspace 4 D & hyprctl dispatch renameworkspace 5 Z & hyprctl dispatch renameworkspace 6 X & hyprctl dispatch renameworkspace 7 C & hyprctl dispatch renameworkspace 8 Q & hyprctl dispatch renameworkspace 9 B & hyprctl dispatch renameworkspace 10 U


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_THEME,macOS
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,macOS-hypr
# So notification toasts resolve Telegram/Browser/etc app icons (Papirus)
env = GTK_ICON_THEME,Papirus-Dark
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Graphite-Dark
env = QT_QPA_PLATFORMTHEME,gtk3
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots
env = XDG_SCREENSHOTS_DIR,$HOME/Pictures/Screenshots
env = XDG_PICTURES_DIR,$HOME/Pictures


###################
### PERMISSIONS ###
###################

