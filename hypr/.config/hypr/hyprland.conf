#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Layouts/Dwindle-Layout/ for more
# (pseudotile config removed in Hyprland 0.56 — toggle still via bind pseudo)
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    # If hyprlock crashes, allow launching it again instead of dead lockscreen
    allow_session_lock_restore = true
}

# Software cursors — fixes buggy/flickering HW cursors on NVIDIA (nouveau)
cursor {
    no_hardware_cursors = 1
    enable_hyprcursor = true
    sync_gsettings_theme = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options =grp:win_space_toggle  
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}




###################
### KEYBINDINGS ###
###################

# Workspace names: see workspaces.conf (defaultName)

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = ALT # Sets "Windows" key as main modifier
$secondMod = WIN
# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
#bind = $mainMod, Z, exec, $terminal
bind = $secondMod, Q, killactive,
#bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
#bind = $mainMod, E, exec, $fileManager
#bind = $mainMod, B, exec, $browser
#bind = WIN, V, exec, ~/.local/bin/windscribe-gui
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, F, exec, vibepanel bar toggle
bind = CTRL, Q, exec, ~/.config/hypr/scripts/clipboard-open.sh
bind = $mainMod, O, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = WIN, L, exec, pidof hyprlock || hyprlock
bind = WIN, W, exec, ~/.local/bin/wallpaper-menu
bind = WIN SHIFT, W, exec, ~/.local/bin/wallpaper-random
bind = WIN CTRL, W, exec, ~/.local/bin/waypaper

# Volueme binds
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle



#Screenshot binds — save + clipboard + cliphist (shows photos in Ctrl+Q)
bind = WIN SHIFT CTRL, 4, exec, ~/.config/hypr/scripts/screenshot-region.sh
# OCR region → clipboard (Raycast-like)
bind = CTRL, T, exec, ~/.config/hypr/scripts/ocr-region.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

#Move window
bind = $mainMod  SHIFT, H, movewindow, l
bind = $mainMod  SHIFT, L, movewindow, r
bind = $mainMod  SHIFT, K, movewindow, u
bind = $mainMod  SHIFT, J, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, W, workspace, 1
bind = $mainMod, E, workspace, 2
bind = $mainMod, T, workspace, 3
bind = $mainMod, D, workspace, 4
bind = $mainMod, Z, workspace, 5
bind = $mainMod, X, workspace, 6
bind = $mainMod, C, workspace, 7
bind = $mainMod, Q, workspace, 8
bind = $mainMod, B, workspace, 9
bind = $mainMod, U, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, W, movetoworkspace, 1
bind = $mainMod SHIFT, E, movetoworkspace, 2
bind = $mainMod SHIFT, T, movetoworkspace, 3
bind = $mainMod SHIFT, D, movetoworkspace, 4
bind = $mainMod SHIFT, Z, movetoworkspace, 5
bind = $mainMod SHIFT, X, movetoworkspace, 6
bind = $mainMod SHIFT, C, movetoworkspace, 7
bind = $mainMod SHIFT, Q, movetoworkspace, 8
bind = $mainMod SHIFT, B, movetoworkspace, 9
bind = $mainMod SHIFT, U, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Clipboard history UI (Ctrl+Q) — floating popup above everything
windowrule {
    name = clipboard-ui-float
    match:class = com.hypr.clipboardhistory
    float = yes
    pin = yes
    center = yes
    opacity = 1.0 override
}

# App → workspace (silent: don't steal focus / switch workspace)
windowrule {
    name = telegram-to-T
    match:class = org.telegram.desktop
    workspace = T silent
}

windowrule {
    name = cursor-to-C
    match:class = ^(cursor|Cursor)$
    workspace = C silent
}

windowrule {
    name = kitty-to-Z
    match:class = ^(kitty)$
    workspace = Z silent
}
