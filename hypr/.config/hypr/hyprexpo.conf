# Mission Control-like overview (hyprexpo / hyprexpo-plus)
# Toggle: Super+Up  |  Close: Super+Down

plugin {
    hyprexpo {
        columns = 3
        gaps_in = 5
        gaps_out = 0
        bg_col = rgb(111318)
        workspace_method = center current
        gesture_distance = 300
        skip_empty = 0
    }
}

# Mac-style Mission Control
bind = SUPER, UP, hyprexpo:expo, toggle
bind = SUPER, DOWN, hyprexpo:expo, off
