# Mission Control-like overview (hyprexpo / hyprexpo-plus)
# Toggle: Ctrl+Up  |  Close: Ctrl+Down

plugin {
    hyprexpo {
        columns = 3
        gaps_in = 5
        gaps_out = 0
        bg_col = rgb(111318)
        workspace_method = center current
        gesture_distance = 300
        skip_empty = 0
    }
}

# Mac-style Mission Control
bind = CTRL, UP, hyprexpo:expo, toggle
bind = CTRL, DOWN, hyprexpo:expo, off
