# GloView — macOS-like Mission Control
# Plugin is loaded from hyprland.conf (absolute path — ~ does not expand)
# Toggle: Super+Up  |  Close: Esc / Super+Down

plugin {
    gloview {
        layout = rows
        gap = 34
        padding = 80
        padding_top = 40
        padding_bottom = 70
        duration = 360
        preview_round = 12
        blur = 1

        switch_animation = 1
        move_animation = 1

        anchor = top
        strip_height = 150
        strip_margin = 22
        strip_gap = 18

        focus_follows_mouse = 1
        scroll_switches_workspace = 1
        exit_on_click = 1

        key_close = escape
        key_activate = enter
        key_all_workspaces = a

        # Keep pinned/named workspaces stable (you rename 1–10 to W/E/T/…)
        dynamic_workspaces = 0
        show_empty = 1
        autodelete_empty = 0

        show_workspace_labels = 1
        show_window_labels = 1
        strip_all_card = 1
    }
}

bind = SUPER, UP, gloview:toggle
bind = SUPER, DOWN, gloview:close
bind = SUPER, LEFT, gloview:prev
bind = SUPER, RIGHT, gloview:next
