# Adaptive hyprlock — wallpaper frost + optical-glass field (ADR-0006)
# Stable options only (hyprlock 0.9.x / Hyprland 0.56)
# Chrome is literals here so theme-ssot cannot retint the shell.

source = ~/.config/hypr/hyprlock-colors.conf

$font = Adwaita Sans
$wallpaper = $HOME/.config/hypr/lock-wallpaper

$textPrimary = rgba(fffffff0)
$textSecondary = rgba(ffffff9e)
$fieldFill = rgba(ffffff0e)
$fieldRim = rgba(ffffff42)
$focusRim = rgba(ffffff5c)
$textHalo = rgba(0000004d)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = outQuint, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3, outQuint
    animation = fadeOut, 1, 3, outQuint
    animation = inputFieldDots, 1, 2, outQuint
}

# Wallpaper (synced by apply-wallpaper-theme) + lock-local frost.
# Not session decoration.blur. Noise/veil/vibrancy off (ADR-0006).
background {
    monitor =
    path = $wallpaper
    color = rgba(000000ff)
    blur_passes = 2
    blur_size = 8
    noise = 0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0
    vibrancy_darkness = 0
}

# Clock — content on frost, not a plate
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = $textPrimary
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $textHalo
    shadow_boost = 1.0
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:30000] date '+%A  ·  %-d %B'
    font_size = 18
    font_family = $font
    color = $textSecondary
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $textHalo
    shadow_boost = 1.0
    position = 0, 10
    halign = center
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 12
    font_family = $font
    color = $textSecondary
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $textHalo
    shadow_boost = 1.0
    position = 0, 170
    halign = center
    valign = bottom
}

# Password field — material.field in air (search analog)
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    outer_color = $fieldRim
    inner_color = $fieldFill
    font_color = $textPrimary
    font_family = $font
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 18
    check_color = $focusRim
    fail_color = $fail
    fail_text = <i>$FAIL</i>
    capslock_color = $textSecondary

    position = 0, 100
    halign = center
    valign = bottom
}
