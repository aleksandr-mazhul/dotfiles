# macOS-style hyprlock
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = Adwaita Sans

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot
    color = rgba(20, 20, 20, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# Large clock (macOS lock style)
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgba(255, 255, 255, 0.95)
    position = 0, 120
    halign = center
    valign = center
}

# Date under clock
label {
    monitor =
    text = cmd[update:60000] date '+%A, %-d %B'
    font_size = 22
    font_family = $font
    color = rgba(255, 255, 255, 0.85)
    position = 0, 40
    halign = center
    valign = center
}

# Username above password field
label {
    monitor =
    text = $USER
    font_size = 16
    font_family = $font
    color = rgba(255, 255, 255, 0.9)
    position = 0, 160
    halign = center
    valign = bottom
}

# Pill-shaped password field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.0)
    inner_color = rgba(255, 255, 255, 0.18)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = $font
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 24
    check_color = rgba(255, 255, 255, 0.35)
    fail_color = rgba(255, 90, 90, 0.85)
    fail_text = <i>$FAIL</i>
    capslock_color = rgba(255, 200, 80, 0.6)

    position = 0, 100
    halign = center
    valign = bottom
}
