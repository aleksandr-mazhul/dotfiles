# Adaptive hyprlock — wallpaper blur + matugen colors
# Stable options only (hyprlock 0.9.x / Hyprland 0.56)

source = ~/.config/hypr/hyprlock-colors.conf

$font = Adwaita Sans
$mono = JetBrains Mono
$wallpaper = $HOME/.config/hypr/lock-wallpaper

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = outQuint, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3, outQuint
    animation = fadeOut, 1, 3, outQuint
    animation = inputFieldDots, 1, 2, outQuint
}

# Wallpaper (synced by apply-wallpaper-theme) + GPU blur
background {
    monitor =
    path = $wallpaper
    color = rgba(19120dff)
    blur_passes = 3
    blur_size = 8
    noise = 0.011
    contrast = 0.92
    brightness = 0.65
    vibrancy = 0.18
    vibrancy_darkness = 0.1
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $mono
    color = $text
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:30000] date '+%A  ·  %-d %B'
    font_size = 18
    font_family = $font
    color = $text_muted
    position = 0, 10
    halign = center
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 14
    font_family = $mono
    color = $accent_glow
    position = 0, 170
    halign = center
    valign = bottom
}

# Glass password field
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent_glow
    inner_color = $field_bg
    font_color = $text
    font_family = $mono
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 16
    check_color = $check
    fail_color = $fail
    fail_text = <i>$FAIL</i>
    capslock_color = $caps

    position = 0, 100
    halign = center
    valign = bottom
}
