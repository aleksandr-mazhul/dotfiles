# Matugen — colors from wallpaper (Material You)
# https://github.com/InioX/matugen

[config]
version_check = false
caching = true

[config.wallpaper]
# Waypaper/swww already set the wallpaper; don't let matugen fight them
set = false
command = ""

# Hyprland border colors
[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors-matugen.lua"

# Hyprlock adaptive lock colors
[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"

# SDDM login theme colors (copied into theme dir by apply-wallpaper-theme)
[templates.sddm]
input_path = "~/.config/matugen/templates/sddm-colors.conf"
output_path = "~/.config/sddm-adaptive/colors.conf"

# Kitty terminal colors
[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors-matugen.conf"

# GTK3/4 accent overrides
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

# Quickshell overlay shell (rice) colors
[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell-colors.qml"
output_path = "~/.config/quickshell/rice/Colors.qml"

# Wofi leftover menus (wallpaper / windscribe) stay in sync
[templates.wofi]
input_path = "~/.config/matugen/templates/wofi-colors.css"
output_path = "~/.config/wofi/colors-matugen.css"
