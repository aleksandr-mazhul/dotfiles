# Matugen — colors from wallpaper (Material You)
# https://github.com/InioX/matugen

[config]
version_check = false
caching = true

[config.wallpaper]
# Waypaper/swww already set the wallpaper; don't let matugen fight them
set = false
command = ""

# Hyprland border colors
[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors-matugen.conf"

# Kitty terminal colors
[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors-matugen.conf"

# GTK3/4 accent overrides
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"
