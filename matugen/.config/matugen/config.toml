# Matugen — colors from wallpaper (Material You)
# https://github.com/InioX/matugen
#
# Intentionally no [templates]: every themed config (hyprland/hyprlock/
# hyprtoolkit colors, kitty, gtk-3.0/gtk-4.0, Quickshell Colors.qml, wofi,
# sddm-adaptive/colors.conf, …) is rendered by the theme SSOT pipeline
# (apply-wallpaper-theme → theme-render from ~/.config/theme/palette.toml).
# A stray `matugen image …` must not clobber those files.

[config]
version_check = false
caching = true

[config.wallpaper]
# Waypaper/swww already set the wallpaper; don't let matugen fight them
set = false
command = ""
