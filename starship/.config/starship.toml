# Generated by theme-ssot — powerline: path · branch · time / ❯
# Chrome: highlight (path) · panel (branch) · muted (time)

format = """
$directory$git_branch$time
$character"""

# Blank line after command output; breathing room to ❯ via kitty adjust_line_height
add_newline = true

[directory]
style = "fg:#1a1008 bg:#aabfde"
format = "[](fg:#aabfde)[ $path ]($style)[](fg:#aabfde bg:#282d36)"
truncation_length = 0
truncate_to_repo = false
fish_style_pwd_dir_length = 0
home_symbol = "~"
read_only = " 󰌾"

[git_branch]
style = "fg:#b9c7d7 bg:#282d36"
format = "[ $branch ]($style)"
symbol = ""

[time]
disabled = false
style = "fg:#c6b8a2 bg:#1f242a"
format = "[](fg:#282d36 bg:#1f242a)[ $time ]($style)[](fg:#1f242a)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold #aabfde)"
error_symbol = "[❯](bold #ffb4ab)"
vimcmd_symbol = "[❮](bold #b9c7d7)"
