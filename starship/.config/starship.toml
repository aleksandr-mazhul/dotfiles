# Generated by theme-ssot — powerline: path · branch · time / ❯
# Chrome: highlight (path) · panel (branch) · muted (time)

format = """
$directory$git_branch$time
$character"""

# Blank line after command output; breathing room to ❯ via kitty adjust_line_height
add_newline = true

[directory]
style = "fg:#1a1008 bg:#aacade"
format = "[](fg:#aacade)[ $path ]($style)[](fg:#aacade bg:#202e31)"
truncation_length = 0
truncate_to_repo = false
fish_style_pwd_dir_length = 0
home_symbol = "~"
read_only = " 󰌾"

[git_branch]
style = "fg:#b9cdd7 bg:#202e31"
format = "[ $branch ]($style)"
symbol = ""

[time]
disabled = false
style = "fg:#c6b1a2 bg:#192325"
format = "[](fg:#202e31 bg:#192325)[ $time ]($style)[](fg:#192325)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold #aacade)"
error_symbol = "[❯](bold #ffb4ab)"
vimcmd_symbol = "[❮](bold #b9cdd7)"
