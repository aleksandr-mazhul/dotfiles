# Generated by theme-ssot — powerline: path · branch · time / ❯
# Chrome: highlight (path) · panel (branch) · muted (time)

format = """
$directory$git_branch$time
$character"""

# Blank line after command output; breathing room to ❯ via kitty adjust_line_height
add_newline = true

[directory]
style = "fg:#1a1008 bg:#ffb688"
format = "[](fg:#ffb688)[ $path ]($style)[](fg:#ffb688 bg:#342931)"
truncation_length = 0
truncate_to_repo = false
fish_style_pwd_dir_length = 0
home_symbol = "~"
read_only = " 󰌾"

[git_branch]
style = "fg:#e5bfa9 bg:#342931"
format = "[ $branch ]($style)"
symbol = ""

[time]
disabled = false
style = "fg:#cac993 bg:#292126"
format = "[](fg:#342931 bg:#292126)[ $time ]($style)[](fg:#292126)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold #ffb688)"
error_symbol = "[❯](bold #ffb4ab)"
vimcmd_symbol = "[❮](bold #e5bfa9)"
