# Generated by theme-ssot — powerline: path · branch · time / ❯
# Chrome: highlight (path) · panel (branch) · muted (time)

format = """
$directory$git_branch$time
$character"""

# Blank line after command output; breathing room to ❯ via kitty adjust_line_height
add_newline = true

[directory]
style = "fg:#1a1008 bg:#90c6c2"
format = "[](fg:#90c6c2)[ $path ]($style)[](fg:#90c6c2 bg:#37443c)"
truncation_length = 0
truncate_to_repo = false
fish_style_pwd_dir_length = 0
home_symbol = "~"
read_only = " 󰌾"

[git_branch]
style = "fg:#b1c7c5 bg:#37443c"
format = "[ $branch ]($style)"
symbol = ""

[time]
disabled = false
style = "fg:#c2ba9c bg:#2e3832"
format = "[](fg:#37443c bg:#2e3832)[ $time ]($style)[](fg:#2e3832)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold #90c6c2)"
error_symbol = "[❯](bold #ffb4ab)"
vimcmd_symbol = "[❮](bold #b1c7c5)"
