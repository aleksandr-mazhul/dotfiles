[Settings]
language = ru
folder = ~/Pictures/Wallpapers
wallpaper = ~/Graphite-gtk-theme/wallpaper/wallpapers/wave-Dark-manjaro.jpg
backend = swww
monitors = All
fill = fill
sort = name
subfolders = True
all_subfolders = True
show_hidden = False
number_of_columns = 3
zen_mode = False
swww_transition_type = any
swww_transition_step = 90
swww_transition_angle = 30
swww_transition_duration = 1.5
swww_transition_fps = 60
post_command = ~/.local/bin/apply-wallpaper-theme $wallpaper
