set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
if-shell '[ "$(uname -s)" = "Darwin" ]' "source-file ~/.config/tmux/macos.conf"
if-shell '[ "$(uname -s)" = "Linux" ]' "source-file ~/.config/tmux/linux.conf"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Primary prefix = mouse service button (Ctrl+B) + Super+B via kitty.
# C-a kept as prefix2.
set -g prefix C-b
set -g prefix2 C-a
bind-key C-b send-prefix
bind-key C-a send-prefix -2

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf
unbind D
unbind C-D
unbind C-S-D
bind D confirm-before -p "Kill window #W? (y/n)" kill-window
# prefix+c = new window (tmux default). prefix+C = new session.
bind C command-prompt -p "New session:" "new-session -s '%%'"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
unbind H
unbind L
unbind -n M-H
unbind -n M-L
unbind '<'
unbind '>'
bind-key H swap-window -d -t -1
bind-key L swap-window -d -t +1
bind-key -n M-H swap-window -d -t -1
bind-key -n M-L swap-window -d -t +1
# Sequential window switch (kitty sends prefix+p/n via Ctrl+PgUp/Dn from kanata).
# Keep Alt+arrows as extra; avoid M-{/M-} — they collide with Shift+[ ] layouts.
bind-key -n C-S-Left previous-window
bind-key -n C-S-Right next-window
unbind -n 'M-{'
unbind -n 'M-}'
bind -r Left resize-pane -L 2
bind -r Right resize-pane -R 2
bind -r Up resize-pane -U 2
bind -r Down resize-pane -D 2

bind -r f resize-pane -Z
bind v copy-mode

bind M-c attach-session -c "#{pane_current_path}"

set -g mouse on

# Keep a deep scrollback; continuum/resurrect persist pane text across reboot
set -g history-limit 50000

set-window-option -g mode-keys vi

set -g set-clipboard on
# Let Neovim/kitty OSC52, Claude Code OSC 99 notifications, and focus events through tmux
set -g allow-passthrough on
set -s extended-keys always
# `always`: forward CSI u even if the app never asked (kitty does not speak modifyOtherKeys)
# Shift+Enter arrives as CSI 13;2u (see kitty map shift+enter)
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy" # Wayland clipboard
# Mouse selection → system clipboard, stay in copy-mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "wl-copy"

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# continuum MUST be last — it hooks status-right for autosave; themes overwrite it
set -g @plugin 'tmux-plugins/tmux-continuum'

# PowerKit (tmux-tokyo-night → tmux-powerkit): top tab chrome, no right widgets
set -g @powerkit_theme "custom"
set -g @powerkit_theme_variant "custom"
set -g @powerkit_custom_theme_path "~/.config/tmux/theme-status.sh"
set -g @powerkit_transparent "true"
set -g @powerkit_status_position "top"
# rounded:all → left  + right  (plain "rounded" only caps the exit edge)
set -g @powerkit_edge_separator_style "rounded:all"
set -g @powerkit_separator_style "normal"
set -g @powerkit_plugins ""
# Index strip restored — colors from theme-status.sh SSOT chrome override
# (active: highlight fg on peach; inactive: muted index + panel name)
set -g @powerkit_active_window_show_index "true"
set -g @powerkit_inactive_window_show_index "true"
set -g @powerkit_active_window_title "#W"
set -g @powerkit_inactive_window_title "#W"

# Persist sessions + pane scrollback (tmux has no built-in; resurrect + continuum)
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'off'  # restore handled by ~/.config/tmux/boot.sh
# Periodic save is now only a floor / crash insurance — the hooks below do the
# real work. It also only runs while a client is attached (continuum hooks
# status-right, and tmux runs #() jobs only when drawing a status line), which
# is exactly why detaching used to freeze saving until the next attach.
set -g @continuum-save-interval '5'

# Without this, a restored pane is just a shell in the right cwd: only
# resurrect's default list (vim/nvim/less/htop/…) is restarted. `~` matches by
# substring, so this covers `npm run db`, `npm run dev`, and so on.
# claude restarts with --continue: each pane resumes its last conversation in
# that directory instead of an empty session.
set -g @resurrect-processes '"~npm run" "claude->claude --continue"'

# @resurrect-save-script-path is set AFTER `run tpm` at the bottom of this file:
# resurrect.tmux overwrites it with its own save.sh on every load.

# Never save while a restore is in flight — boot.sh's restore fires a storm of
# session-created/after-new-window hooks, and a save landing mid-restore would
# overwrite `last` with a half-restored tree.
set -g @resurrect-hook-pre-restore-all  'mkdir -p "${XDG_RUNTIME_DIR:-/tmp}/tmux-save-$(id -u)" && touch "${XDG_RUNTIME_DIR:-/tmp}/tmux-save-$(id -u)/inhibit"'
set -g @resurrect-hook-post-restore-all 'rm -f "${XDG_RUNTIME_DIR:-/tmp}/tmux-save-$(id -u)/inhibit"'

# --- event-driven saves ------------------------------------------------------
# Structure changed -> debounced save ~4s after the last event in a burst.
# run-shell -b is mandatory: run-shell is synchronous and blocks the client for
# the whole hook, which on a direct save.sh call is a visible ~300ms stutter.
set-hook -g after-new-window       'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g after-split-window     'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g after-kill-pane        'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g after-rename-window    'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g after-rename-session   'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g pane-exited            'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g pane-died              'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g window-linked          'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g window-unlinked        'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g window-layout-changed  'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g session-created        'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g session-closed         'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g session-renamed        'run-shell -b "~/.config/tmux/tmux-save.sh request"'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/tmux-save.sh request"'

# "The state I left" — detach saves immediately, skipping the debounce.
set-hook -g client-detached        'run-shell -b "~/.config/tmux/tmux-save.sh now"'

# There is no after-kill-window hook in tmux 3.7 (set-hook rejects it);
# window-unlinked is what actually fires on kill-window.
#
# Deliberately NOT hooked, all measured pathological:
#   window-renamed        automatic-rename is on, so it fires on every
#                         foreground command starting or finishing
#   after-select-window / session-window-changed    every window switch
#   after-select-pane / window-pane-changed         every pane move
#                         (vim-tmux-navigator on Ctrl+hjkl)
#   window-resized / client-resized                 Hyprland retiling
#   pane-focus-in / pane-focus-out                  focus-events is on
# Also never hook anything the save path itself calls — after-capture-pane,
# after-list-panes/windows/sessions/clients, after-set-option, after-show-options
# — the script calls tmux back and the hook re-fires without limit.

# Manual save (prefix + Ctrl-s) through the same lock.
bind C-s run-shell -b '~/.config/tmux/tmux-save.sh now'
# Manual restore: prefix + Ctrl-r

# vim-tmux-navigator uses Ctrl+hjkl (matches nvim). Do not unbind.
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Continuum autosave runs via a status-right #(…) hook. Keep ONLY that hook —
# clearing status-right (or a theme overwrite) silently disables all saves.
# (Since the hooks above also save, losing this degrades rather than kills it.)
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)'
# The theme sets status-interval 5, which only re-runs that hook (the status
# line shows no clock). 15s is still far under continuum's 5-minute save.
set -g status-interval 15

# MUST come after `run tpm`: resurrect.tmux:30 does
#   tmux set-option -gq @resurrect-save-script-path "$CURRENT_DIR/scripts/save.sh"
# on every load, clobbering an earlier value. Routing continuum's periodic tick
# and prefix+C-s through the wrapper is what keeps every save under one lock.
#
# Set via run-shell so $HOME is expanded: continuum invokes this as
# `"$path" "quiet"`, and a literal ~ inside quotes does NOT expand -> exit 127.
# That failure is silent, because continuum stamps the save timestamp anyway.
run-shell 'tmux set -g @resurrect-save-script-path "$HOME/.config/tmux/tmux-save.sh"'
