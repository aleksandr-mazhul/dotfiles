set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
if-shell '[ "$(uname -s)" = "Darwin" ]' "source-file ~/.config/tmux/macos.conf"
if-shell '[ "$(uname -s)" = "Linux" ]' "source-file ~/.config/tmux/linux.conf"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Primary prefix = mouse "service mode" (LCtrl+B). C-a kept as prefix2 for muscle memory.
set -g prefix C-b
set -g prefix2 C-a
bind-key C-b send-prefix
bind-key C-a send-prefix -2

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf
unbind D
unbind C-D
unbind C-S-D
bind D confirm-before -p "Kill window #W? (y/n)" kill-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
unbind H
unbind L
unbind -n M-H
unbind -n M-L
unbind '<'
unbind '>'
bind-key H swap-window -d -t -1
bind-key L swap-window -d -t +1
bind-key -n M-H swap-window -d -t -1
bind-key -n M-L swap-window -d -t +1
bind-key -n 'M-{' previous-window
bind-key -n 'M-}' next-window
bind-key -n C-S-Left previous-window
bind-key -n C-S-Right next-window
bind -r Left resize-pane -L 2
bind -r Right resize-pane -R 2
bind -r Up resize-pane -U 2
bind -r Down resize-pane -D 2

bind -r f resize-pane -Z
bind v copy-mode

bind M-c attach-session -c "#{pane_current_path}"

set -g mouse on

set-window-option -g mode-keys vi

set -g set-clipboard on

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy" # Wayland clipboard

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# PowerKit (tmux-tokyo-night) — Mac-like widgets, sand/matugen palette
set -g @powerkit_theme "custom"
set -g @powerkit_theme_variant "custom"
set -g @powerkit_custom_theme_path "~/.config/tmux/sand-theme.sh"
set -g @powerkit_transparent "true"
set -g @powerkit_status_position "top"
set -g @powerkit_edge_separator_style "rounded"
# session + windows always shown; right plugins ≈ Mac defaults minus battery
set -g @powerkit_plugins "datetime,hostname,git"
set -g @powerkit_plugin_datetime_format "time"
set -g @powerkit_plugin_hostname_format "short"

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
